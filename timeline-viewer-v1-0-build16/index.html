<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Timeline — Chronicle Viewer</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Mono:wght@300;400;500&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=EB+Garamond:ital,wght@0,400;0,700;1,400&family=Josefin+Sans:wght@300;400;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ink: #1a1208;
  --parchment: #f5f0e8;
  --rust: #b84c2e;
  --gold: #c9923a;
  --line: rgba(26,18,8,0.15);
  --serif: 'Playfair Display', Georgia, serif;
  --body-font: 'Crimson Pro', Georgia, serif;
  --mono: 'DM Mono', monospace;
}
html { scroll-behavior: smooth; }
body {
  background: #f5f0e8;
  background-attachment: fixed;
  font-family: var(--body-font);
  color: var(--ink);
  min-height: 100vh;
}
/* ── VIEWER HEADER ── */
.viewer-topbar {
  background: var(--ink);
  padding: 10px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}
.viewer-topbar-title {
  font-family: var(--serif);
  font-size: 15px;
  font-weight: 700;
  color: rgba(245,240,232,0.9);
  letter-spacing: 0.5px;
}
.viewer-topbar-sub {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: rgba(245,240,232,0.35);
}
/* ── FILTER BAR ── */
.filter-bar {
  background: rgba(26,18,8,0.92);
  padding: 8px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  
}
.filter-label { font-family: var(--mono); font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: rgba(245,240,232,0.4); flex-shrink: 0; }
.filter-chip { display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;border:1.5px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.06);color:rgba(245,240,232,0.75);font-family:var(--mono);font-size:10px;letter-spacing:1px;cursor:pointer;transition:all 0.15s;user-select:none; }
.filter-chip:hover { border-color:rgba(255,255,255,0.5);background:rgba(255,255,255,0.12); }
.filter-chip.active { background:#b84c2e;border-color:#b84c2e;color:white; }
.filter-chip .chip-dot { width:8px;height:8px;border-radius:50%;flex-shrink:0; }
.filter-sep { width:1px;height:20px;background:rgba(255,255,255,0.1);flex-shrink:0; }
.filter-imp-btn { display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:3px;border:1px solid rgba(255,255,255,0.15);background:transparent;color:rgba(245,240,232,0.5);font-family:var(--mono);font-size:9px;letter-spacing:1px;cursor:pointer;transition:all 0.15s; }
.filter-imp-btn.active { background:rgba(255,255,255,0.15);color:rgba(245,240,232,0.9);border-color:rgba(255,255,255,0.3); }
/* ── TIMELINE ── */
#timeline-canvas {
  width: 1200px;
  max-width: 100%;
  margin: 0 auto;
  background: #f5f0e8;
  position: relative;
  padding-bottom: 40px;
}
#timeline-canvas::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(26,18,8,0.04) 27px, rgba(26,18,8,0.04) 28px);
  pointer-events: none;
  z-index: 0;
}
.tl-header { text-align:center;padding:40px 60px 20px;position:relative;z-index:1; }
.tl-title { font-family:var(--serif);font-weight:900;color:var(--ink);line-height:1.1;font-size:42px; }
.tl-byline { font-family:var(--body-font);font-style:italic;font-size:16px;color:var(--ink);opacity:0.55;margin-top:6px;letter-spacing:0.5px; }
.tl-subtitle { font-family:var(--body-font);font-style:italic;color:var(--ink);opacity:0.6;margin-top:8px;font-size:17px; }
.tl-header-rule { width:60px;height:3px;background:#b84c2e;margin:16px auto 0; }
.tl-body { position:relative;padding:20px 0 60px;z-index:1; }
.tl-spine { position:absolute;left:50%;top:0;bottom:0;width:2px;background:#1a1208;transform:translateX(-50%); }
.tl-spine::before,.tl-spine::after { content:'';position:absolute;left:50%;transform:translateX(-50%);width:10px;height:10px;background:#1a1208;border-radius:50%; }
.tl-spine::before { top:0; }
.tl-spine::after { bottom:0; }
.tl-entry { display:flex;align-items:flex-start;position:relative;min-height:80px; }
.tl-entry:nth-child(odd) { flex-direction:row; }
.tl-entry:nth-child(even) { flex-direction:row-reverse; }
.tl-entry-content { width:calc(50% - 40px);padding:0 20px 30px;position:relative; }
.tl-entry:nth-child(odd) .tl-entry-content { text-align:right;padding-right:30px; }
.tl-entry:nth-child(even) .tl-entry-content { text-align:left;padding-left:30px; }
.tl-entry-spacer { width:calc(50% - 40px); }
.tl-entry-node { position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:2; }
.tl-node-dot { border-radius:50%;border:3px solid var(--ink);background:var(--parchment);box-shadow:0 0 0 3px var(--parchment);transition:transform 0.2s; }
.tl-node-dot:hover { transform:scale(1.3); }
.tl-entry-year { font-family:var(--mono);font-size:12px;letter-spacing:2px;opacity:0.5;margin-bottom:4px; }
.tl-entry-title { font-family:var(--serif);font-weight:700;color:var(--ink);line-height:1.2;margin-bottom:6px; }
.tl-entry-desc { font-family:var(--body-font);color:var(--ink);opacity:0.75;line-height:1.6;font-size:14px; }
.tl-entry-citation { font-family:var(--mono);font-size:9px;opacity:0.3;margin-top:4px;font-style:italic; }
.tl-img-gallery { display:flex;gap:6px;flex-wrap:wrap;margin-top:8px; }
.tl-img-thumb { width:48px;height:48px;object-fit:cover;border-radius:2px;border:1.5px solid rgba(0,0,0,0.12);cursor:pointer;transition:transform 0.15s,box-shadow 0.15s; }
.tl-img-thumb:hover { transform:scale(1.08);box-shadow:0 4px 16px rgba(0,0,0,0.25); }
.tl-img-inline { width:100%;max-height:160px;object-fit:cover;border-radius:2px;margin-top:8px;border:1px solid rgba(0,0,0,0.08);cursor:pointer; }
.tl-img-hover-wrap { position:relative;display:inline-block; }
.tl-img-hidden-badge { display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-family:var(--mono);font-size:9px;letter-spacing:1px;opacity:0.4;cursor:pointer;border-bottom:1px dashed currentColor;transition:opacity 0.15s; }
.tl-img-hidden-badge:hover { opacity:0.8; }
.tl-img-hover-preview { position:absolute;z-index:50;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) scale(0.95);width:200px;border-radius:3px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.4);opacity:0;pointer-events:none;transition:opacity 0.15s,transform 0.15s; }
.tl-img-hover-wrap:hover .tl-img-hover-preview { opacity:1;transform:translateX(-50%) scale(1); }
.tl-img-hover-preview img { width:100%;display:block; }
.imp-badge { display:inline-block;font-family:var(--mono);font-size:8px;letter-spacing:1px;text-transform:uppercase;opacity:0.45;margin-bottom:2px; }
.tl-era-divider { display:flex;align-items:center;gap:16px;padding:24px 40px 12px;position:relative;z-index:1; }
.tl-era-label { font-family:var(--serif);font-weight:900;font-size:11px;letter-spacing:3px;text-transform:uppercase;opacity:0.35;white-space:nowrap;flex-shrink:0; }
.tl-era-line { flex:1;height:1px;background:currentColor;opacity:0.15; }
.tl-entry.imp-1 .tl-node-dot { width:8px!important;height:8px!important;opacity:0.5; }
.tl-entry.imp-2 .tl-node-dot { width:10px!important;height:10px!important;opacity:0.7; }
.tl-entry.imp-3 .tl-node-dot { width:14px!important;height:14px!important; }
.tl-entry.imp-4 .tl-node-dot { width:18px!important;height:18px!important;box-shadow:0 0 0 3px rgba(0,0,0,0.08); }
.tl-entry.imp-5 .tl-node-dot { width:22px!important;height:22px!important;box-shadow:0 0 0 4px rgba(0,0,0,0.1),0 0 0 7px rgba(0,0,0,0.04); }
.tl-entry.imp-1 .tl-entry-title { opacity:0.6; }
/* Media badge */
.media-badge { display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;font-size:10px;cursor:pointer;margin-top:6px;opacity:0.7;transition:opacity 0.15s,transform 0.15s;position:relative;z-index:10; }
.media-badge:hover { opacity:1;transform:scale(1.1); }
.media-popup { position:fixed;z-index:999;background:#1a1208;border:2px solid #1a1208;border-radius:4px;box-shadow:0 8px 40px rgba(0,0,0,0.6);overflow:hidden;pointer-events:none;opacity:0;transform:scale(0.95) translateY(4px);transition:opacity 0.18s,transform 0.18s;width:320px; }
.media-popup.visible { opacity:1;transform:scale(1) translateY(0);pointer-events:all; }
.media-popup iframe { display:block;width:100%;height:180px;border:none; }
.media-popup img { display:block;width:100%;max-height:260px;object-fit:contain;background:#000; }
.media-popup-label { padding:6px 10px;font-family:var(--mono);font-size:9px;letter-spacing:1px;color:rgba(245,240,232,0.5);text-transform:uppercase;display:flex;align-items:center;justify-content:space-between; }
.media-popup-close { background:none;border:none;color:rgba(245,240,232,0.5);cursor:pointer;font-size:14px;padding:0;line-height:1; }
/* Lightbox */
#lightbox { position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.92);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.2s;flex-direction:column;gap:12px; }
#lightbox.visible { opacity:1;pointer-events:all; }
#lightbox-img { max-width:90vw;max-height:80vh;object-fit:contain;border-radius:2px;box-shadow:0 20px 80px rgba(0,0,0,0.8); }
#lightbox-caption { color:rgba(255,255,255,0.6);font-family:var(--body-font);font-style:italic;font-size:15px;text-align:center; }
#lightbox-nav { display:flex;gap:16px; }
.lb-btn { background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:white;padding:8px 20px;border-radius:2px;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:1px;transition:background 0.15s; }
.lb-btn:hover { background:rgba(255,255,255,0.2); }
#lightbox-close { position:absolute;top:20px;right:24px;color:rgba(255,255,255,0.5);font-size:28px;cursor:pointer;line-height:1;background:none;border:none; }
#lightbox-close:hover { color:white; }
#lightbox-counter { font-family:var(--mono);font-size:10px;color:rgba(255,255,255,0.35);letter-spacing:2px; }
/* Footer */
.tl-footer { text-align:center;padding:20px 60px 30px;font-family:var(--mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--ink);opacity:0.35;position:relative;z-index:1; }
.viewer-timestamp { text-align:center;font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(26,18,8,0.3);padding:8px; }
/* Dark theme */
.theme-dark .tl-title,.theme-dark .tl-subtitle,.theme-dark .tl-byline,.theme-dark .tl-entry-year,.theme-dark .tl-entry-desc,.theme-dark .tl-entry-citation { color:rgba(245,240,232,0.85)!important; }
/* Compact mode */
.compact .tl-entry-desc,.compact .tl-entry-citation,.compact .tl-img-inline,.compact .tl-img-gallery,.compact .tl-img-hover-wrap { display:none!important; }
.compact .tl-entry-title { font-size:13px!important;margin-bottom:2px; }
.compact .tl-entry-year { font-size:10px!important;margin-bottom:1px; }
.compact .imp-badge { display:none; }
/* Horizontal timeline */
#timeline-canvas.horizontal { display:flex;flex-direction:column;width:auto!important;min-width:max-content;overflow-x:auto; }
#timeline-canvas.horizontal .tl-body { display:flex;flex-direction:row;align-items:stretch;padding:0 60px;min-height:420px;position:relative; }
#timeline-canvas.horizontal .tl-spine { position:absolute;left:0;right:0;top:50%;bottom:auto;width:100%;height:2px;transform:translateY(-50%); }
#timeline-canvas.horizontal .tl-spine::before { top:50%;left:0;transform:translateY(-50%);width:10px;height:10px; }
#timeline-canvas.horizontal .tl-spine::after { top:50%;right:0;left:auto;transform:translateY(-50%);width:10px;height:10px; }
#timeline-canvas.horizontal .tl-entry { display:flex;flex-direction:column!important;align-items:center;position:relative;min-height:unset;flex-shrink:0; }
#timeline-canvas.horizontal .tl-entry-above { flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:28px;text-align:center; }
#timeline-canvas.horizontal .tl-entry-below { flex:1;display:flex;flex-direction:column;justify-content:flex-start;padding-top:28px;text-align:center; }
#timeline-canvas.horizontal .tl-entry-node { position:relative;left:auto;top:auto;transform:none;flex-shrink:0;z-index:2; }
#timeline-canvas.horizontal .tl-entry-spacer { display:none; }
#timeline-canvas.horizontal .tl-era-divider { flex-direction:column;width:20px;padding:0;align-items:center;justify-content:center;flex-shrink:0; }
#timeline-canvas.horizontal .tl-era-line { width:1px;height:40px;flex:unset; }
#timeline-canvas.horizontal .tl-era-label { writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:2px;font-size:9px;margin:4px 0; }
/* Proportional vertical */
.tl-body.proportional .tl-entry { position:absolute;width:100%; }
/* Mobile override */
@media (max-width: 768px) {
  #timeline-canvas.mobile-vertical { display:block!important; }
  #timeline-canvas.mobile-vertical .tl-body { display:block!important;min-height:unset!important; }
  #timeline-canvas.mobile-vertical .tl-spine { position:absolute;left:50%;top:0;bottom:0;width:2px;height:auto;transform:translateX(-50%)!important; }
  #timeline-canvas.mobile-vertical .tl-entry { flex-direction:row!important;min-height:80px; }
  #timeline-canvas.mobile-vertical .tl-entry:nth-child(even) { flex-direction:row-reverse!important; }
  #timeline-canvas.mobile-vertical .tl-entry-node { position:absolute;left:50%;top:8px;transform:translateX(-50%); }
  #timeline-canvas.mobile-vertical .tl-entry-above,.tl-entry-below { display:none; }
  #timeline-canvas.mobile-vertical .tl-entry-content { display:block;width:calc(50% - 40px);padding:0 20px 30px; }
}
/* Single col */
#timeline-canvas.single-col .tl-spine { left:40px; }
#timeline-canvas.single-col .tl-entry { flex-direction:row!important; }
#timeline-canvas.single-col .tl-entry-content { width:calc(100% - 80px);text-align:left!important;padding-left:30px!important;padding-right:20px!important; }
#timeline-canvas.single-col .tl-entry-node { left:40px; }
#timeline-canvas.single-col .tl-entry-spacer { display:none; }
/* Loading */
#loading-state { text-align:center;padding:80px 20px;font-family:var(--mono);font-size:11px;letter-spacing:2px;text-transform:uppercase;opacity:0.4; }
/* Scrollbar */
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-thumb { background:rgba(26,18,8,0.2);border-radius:3px; }
</style>
</head>
<body>

<script>
// ── CONFIG (baked in at export time) ──
const SHEET_ID = '1h-38gj_6q8KdHskIhK5M5axs7FPHtCkrtRN9M-e2eGY';
const PUB_BASE = '';
const IS_PUB_URL = false;
const TAB_NAME = '';
const REFRESH_MS = 300000;
const IMP_COLORS = {"1":"#999999","2":"#7a9e7a","3":"#b84c2e","4":"#c9923a","5":"#7c3aed"};
const CAT_COLORS = {"GW":"#b84c2e"};
const SETTINGS = {"titleSize":42,"entryTitleSize":18,"descSize":14,"spacing":20,"layout":"alternating","orientation":"vertical","mobileOrientation":"vertical","spacingMode":"proportional","minGap":41,"compactMode":false,"spineColor":"#1a1208","overrideColors":false,"overrideColor":"#b84c2e","displayFont":"'Playfair Display', Georgia, serif","bodyFont":"'Crimson Pro', Georgia, serif","eras":"","showEras":true,"bg":"#f5f0e8"};

// ── STATE ──
let allEntries = [];
let activeCategories = new Set();
let minImp = 1;
let lbImages = [], lbIdx = 0, lbTitle = '';
let popupHideTimer = null;

// ── CSV FETCH ──
function buildCsvUrl() {
  if (IS_PUB_URL && PUB_BASE) {
    let params = 'output=csv&single=true';
    if (TAB_NAME) params += '&sheet=' + encodeURIComponent(TAB_NAME);
    return PUB_BASE + '?' + params;
  }
  // Standard sheet ID via gviz
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv${TAB_NAME ? '&sheet=' + encodeURIComponent(TAB_NAME) : ''}`;
}

function parseCSV(text) {
  const rows = []; let row = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i], nx = text[i+1];
    if (inQ) { if (ch==='"'&&nx==='"'){field+='"';i++;} else if(ch==='"'){inQ=false;} else{field+=ch;} }
    else { if(ch==='"'){inQ=true;} else if(ch===','){row.push(field);field='';} else if(ch==='\n'||(ch==='\r'&&nx==='\n')){row.push(field);field='';if(row.some(c=>c.trim()))rows.push(row);row=[];if(ch==='\r')i++;} else{field+=ch;} }
  }
  if(field||row.length){row.push(field);if(row.some(c=>c.trim()))rows.push(row);}
  return rows;
}

function colIdx(letter) {
  letter = (letter||'A').toUpperCase().trim(); let n=0;
  for(let i=0;i<letter.length;i++) n=n*26+(letter.charCodeAt(i)-64);
  return n-1;
}

function fixDriveUrl(url) {
  if(!url) return url;
  const m = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
  if(m) return `https://drive.google.com/uc?export=view&id=${m[1]}`;
  return url;
}

function guessSortKey(yr) {
  if(!yr) return 0;
  const s = yr.replace(/,/g,'').trim();
  const bce = s.match(/(-?\d+\.?\d*)\s*(bce|bc)/i); if(bce) return -Math.abs(parseFloat(bce[1]));
  const bya = s.match(/(-?\d+\.?\d*)\s*bya/i); if(bya) return -parseFloat(bya[1])*1e9;
  const mya = s.match(/(-?\d+\.?\d*)\s*mya/i); if(mya) return -parseFloat(mya[1])*1e6;
  const kya = s.match(/(-?\d+\.?\d*)\s*kya/i); if(kya) return -parseFloat(kya[1])*1e3;
  const p = s.match(/^-?\d+\.?\d*/); return p ? parseFloat(p[0]) : 0;
}

async function loadData() {
  if(!SHEET_ID) { document.getElementById('loading-state').textContent = 'No sheet connected.'; return; }
  document.getElementById('viewer-sync-status').textContent = '⟳ Syncing…';
  try {
    const res = await fetch(buildCsvUrl());
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const rows = parseCSV(text);
    if(rows.length < 2) { document.getElementById('loading-state').textContent = 'Sheet is empty.'; return; }
    // Column mapping A=0,B=1,C=2,D=3,E=4,F=5,G=6
    allEntries = rows.slice(1).map((row,i) => {
      const title = (row[0]||'').trim(); if(!title) return null;
      const yr = (row[1]||'').trim();
      const sortRaw = parseFloat(row[2]);
      const color = (row[4]||'').trim();
      return {
        id: i,
        title,
        year: yr,
        sortKey: isNaN(sortRaw) ? guessSortKey(yr) : sortRaw,
        desc: (row[3]||'').trim(),
        color: color.startsWith('#') ? color : (IMP_COLORS[3]||'#b84c2e'),
        images: fixDriveUrl((row[5]||'').trim()) ? [fixDriveUrl((row[5]||'').trim())] : [],
        mediaUrl: (row[6]||'').trim(),
        category: (row[7]||'').trim(),
        importance: parseInt(row[8])||3,
        location: (row[9]||'').trim(),
        citation: (row[10]||'').trim(),
        imageDisplay: 'inline'
      };
    }).filter(Boolean);

    renderTimeline();
    rebuildFilters();
    const now = new Date();
    const ts = document.getElementById('viewer-timestamp');
    if(ts) ts.textContent = 'Last updated: ' + now.toLocaleTimeString();
    document.getElementById('viewer-sync-status').textContent = '✓ Live';
    setTimeout(()=>{ document.getElementById('viewer-sync-status').textContent=''; }, 3000);
  } catch(err) {
    document.getElementById('viewer-sync-status').textContent = '⚠ Sync error';
    console.error('Chronicle viewer error:', err);
  }
}

// ── RENDER ──
function getVisible() {
  return allEntries.filter(e => {
    const catOk = activeCategories.size === 0 || activeCategories.has(e.category||'');
    const impOk = (e.importance||3) >= minImp;
    return catOk && impOk;
  });
}

function parseEras() {
  if(!SETTINGS.eras||!SETTINGS.showEras) return [];
  return SETTINGS.eras.split('\n').map(line => {
    const parts = line.split(','); if(parts.length<2) return null;
    const yr = parseFloat(parts[0].trim()), label = parts.slice(1).join(',').trim();
    return (!isNaN(yr)&&label) ? {year:yr,label} : null;
  }).filter(Boolean).sort((a,b)=>a.year-b.year);
}

function renderTimeline() {
  const container = document.getElementById('tl-entries-container');
  const canvas = document.getElementById('timeline-canvas');
  const body = document.getElementById('tl-body') || canvas.querySelector('.tl-body');
  const visible = getVisible();
  const dFont = SETTINGS.displayFont||"'Playfair Display',Georgia,serif";
  const bFont = SETTINGS.bodyFont||"'Crimson Pro',Georgia,serif";
  const isMobile = window.innerWidth <= 768;
  const orientation = isMobile ? SETTINGS.mobileOrientation : SETTINGS.orientation;

  // Apply classes
  canvas.classList.toggle('horizontal', orientation === 'horizontal');
  canvas.classList.toggle('single-col', SETTINGS.layout === 'single' && orientation === 'vertical');
  canvas.classList.toggle('compact', SETTINGS.compactMode);
  canvas.classList.toggle('mobile-vertical', isMobile && SETTINGS.mobileOrientation === 'vertical' && SETTINGS.orientation === 'horizontal');

  // Dark theme
  const bgHex = SETTINGS.bg || '#f5f0e8';
  const r=parseInt(bgHex.slice(1,3),16),g=parseInt(bgHex.slice(3,5),16),b=parseInt(bgHex.slice(5,7),16);
  canvas.classList.toggle('theme-dark', (r*299+g*587+b*114)/1000 < 128);

  if(!visible.length) {
    container.innerHTML = '<div id="loading-state">No entries match the current filters.</div>';
    return;
  }

  // Proportional spacing
  let posMap = null, widthMap = null;
  const minGap = SETTINGS.minGap || 40;
  if (SETTINGS.spacingMode === 'proportional' && visible.length > 1) {
    const keys = visible.map(e=>e.sortKey);
    const minK = Math.min(...keys), maxK = Math.max(...keys), span = maxK-minK||1;
    if (orientation === 'vertical') {
      const totalSize = Math.max(600, visible.length*minGap*2);
      let pos = visible.map(e=>((e.sortKey-minK)/span)*totalSize);
      for(let i=1;i<pos.length;i++) if(pos[i]-pos[i-1]<minGap) pos[i]=pos[i-1]+minGap;
      const hdr=120, tot=pos[pos.length-1]+120;
      posMap={};
      visible.forEach((e,i)=>{posMap[e.id]={pos:pos[i]+hdr,total:tot};});
      if(body){body.style.height=tot+'px';body.classList.add('proportional');}
    } else {
      const ew=Math.max(140,minGap*2), tw=Math.max(visible.length*ew,800);
      let pos=visible.map(e=>((e.sortKey-minK)/span)*(tw-ew));
      for(let i=1;i<pos.length;i++) if(pos[i]-pos[i-1]<minGap) pos[i]=pos[i-1]+minGap;
      widthMap=visible.map((e,i)=>({ml:i===0?pos[0]:pos[i]-pos[i-1]-ew,w:ew}));
      if(body){body.style.height='';body.classList.remove('proportional');}
    }
  } else {
    if(body){body.style.height='';body.classList.remove('proportional');}
  }

  const eras = parseEras();
  let html='', lastEra=-1;

  // Year grouping for connector thickness
  const grpMap = new Map();
  visible.forEach(e => {
    const k = Math.round(e.sortKey);
    if (!grpMap.has(k)) grpMap.set(k, []);
    grpMap.get(k).push(e.id);
  });
  const grpSize = new Map(), grpIdx = new Map();
  grpMap.forEach(ids => ids.forEach((id,i) => { grpSize.set(id,ids.length); grpIdx.set(id,i); }));
  function vThick(n) { return Math.min(6.5, 1.5 + (n-1)*1.2); }

  function makeVConn(e, color, isLeft) {
    const cnt = grpSize.get(e.id)||1, thick = vThick(cnt);
    const gi = grpIdx.get(e.id)||0, tvh = (cnt-1)*20, vOff = gi*20 - tvh/2;
    const side = isLeft ? `right:calc(50% - 38px)` : `left:calc(50% - 38px)`;
    const fd = isLeft ? 'row' : 'row-reverse';
    const hbr = isLeft ? '1px 0 0 1px' : '0 1px 1px 0';
    if (cnt===1) return `<div style="position:absolute;${side};top:14px;display:flex;align-items:center;pointer-events:none;z-index:1"><div style="height:${thick*0.55}px;width:22px;background:${color};opacity:0.38;border-radius:${hbr}"></div></div>`;
    return `<div style="position:absolute;${side};top:${14+vOff}px;display:flex;flex-direction:${fd};align-items:flex-start;pointer-events:none;z-index:1">
      ${gi===0?`<div style="width:${thick}px;height:${tvh+thick*0.8}px;background:${color};opacity:0.55;border-radius:${thick/2}px;flex-shrink:0"></div>`:`<div style="width:${thick}px;flex-shrink:0"></div>`}
      <div style="height:${thick*0.55}px;width:22px;background:${color};opacity:0.38;align-self:center;border-radius:${hbr};flex-shrink:0"></div>
    </div>`;
  }

  visible.forEach((e,i)=>{
    const color = SETTINGS.overrideColors ? SETTINGS.overrideColor
      : (CAT_COLORS[e.category]||e.color||'#b84c2e');
    const imp=e.importance||3;
    const impScale=[0,0.8,0.9,1,1.12,1.28][imp]||1;
    const titleSize=Math.round(SETTINGS.entryTitleSize*impScale);
    const impLabels=['','BLIP','MOMENT','EVENT','MILESTONE','LANDMARK'];
    const safeMedia=(e.mediaUrl||'').replace(/'/g,"\'");
    const mType=detectMediaType(e.mediaUrl);
    const mediaBadge=mType?`<div class="media-badge" style="color:${color}" onmouseenter="showMediaPopup(event,'${safeMedia}','${mType}')" onmouseleave="scheduleHidePopup()" onclick="showMediaPopup(event,'${safeMedia}','${mType}')">${mType==='youtube'||mType==='vimeo'||mType==='video'?'▶':'⊞'}</div>`:'';
    const imgs=e.images&&e.images.length?e.images:[];
    let imgsHtml='';
    if(imgs.length){
      if(e.imageDisplay==='thumbnail') imgsHtml=`<div class="tl-img-gallery">${imgs.map((src,idx)=>`<img class="tl-img-thumb" src="${src}" onclick="openLightbox(${e.id},${idx})" />`).join('')}</div>`;
      else imgsHtml=`<img class="tl-img-inline" src="${imgs[0]}" onclick="openLightbox(${e.id},0)" />`;
    }
    const contentInner=`
      ${imp!==3?`<div class="imp-badge" style="color:${color}">${impLabels[imp]}</div>`:''}
      <div class="tl-entry-year">${e.year}</div>
      <div class="tl-entry-title" style="font-size:${titleSize}px;color:${color};font-family:${dFont}">${e.title}</div>
      ${e.location?`<div style="font-family:var(--mono);font-size:${SETTINGS.descSize-3}px;opacity:0.4;margin-top:3px">📍 ${e.location}</div>`:''}
      ${e.desc?`<div class="tl-entry-desc">${e.desc}</div>`:''}
      ${e.citation?`<div class="tl-entry-citation">Source: ${e.citation}</div>`:''}
      ${imgsHtml}${mediaBadge}`;

    // Era dividers
    if(eras.length) eras.forEach((era,ei)=>{
      if(ei>lastEra&&e.sortKey>=era.year){
        if(orientation==='horizontal') html+=`<div class="tl-era-divider"><div class="tl-era-line"></div><div class="tl-era-label" style="font-family:${dFont}">${era.label}</div><div class="tl-era-line"></div></div>`;
        else html+=`<div class="tl-era-divider" style="position:${posMap?'absolute;top:'+(posMap[e.id].pos-30)+'px;left:0;right:0':'relative'};z-index:1"><div class="tl-era-line"></div><div class="tl-era-label" style="font-family:${dFont}">${era.label}</div><div class="tl-era-line"></div></div>`;
        lastEra=ei;
      }
    });

    if(orientation==='horizontal'){
      const isAbove=i%2===0;
      const ew=widthMap?widthMap[i].w:Math.max(120,SETTINGS.entryTitleSize*8);
      const ml=widthMap?widthMap[i].ml:SETTINGS.spacing+8;
      html+=`<div class="tl-entry imp-${imp}" style="width:${ew}px;margin-left:${ml}px;flex-shrink:0">
        ${isAbove?`<div class="tl-entry-above" style="font-family:${dFont}">${contentInner}</div><div class="tl-entry-node"><div class="tl-node-dot" style="width:14px;height:14px;border-color:${color};background:${color}"></div></div><div class="tl-entry-below"></div>`
        :`<div class="tl-entry-above"></div><div class="tl-entry-node"><div class="tl-node-dot" style="width:14px;height:14px;border-color:${color};background:${color}"></div></div><div class="tl-entry-below" style="font-family:${dFont}">${contentInner}</div>`}
      </div>`;
    } else {
      const posStyle=posMap?`position:absolute;top:${posMap[e.id].pos}px;width:100%`:`padding-bottom:${SETTINGS.spacing+20}px`;
      const isLeft = SETTINGS.layout !== 'single' && i % 2 === 0;
      const conn = orientation !== 'horizontal' ? makeVConn(e, color, isLeft) : '';
      html+=`<div class="tl-entry imp-${imp}" style="${posStyle};position:relative">
        ${SETTINGS.layout!=='single'?'<div class="tl-entry-spacer"></div>':''}
        <div class="tl-entry-node"><div class="tl-node-dot" style="width:14px;height:14px;border-color:${color};background:${color}"></div></div>
        <div class="tl-entry-content" style="background:${SETTINGS.bg||'#f5f0e8'}">${contentInner}</div>
        ${conn}
      </div>`;
    }
  });

  container.innerHTML=html;
}

// ── FILTERS ──
const palette = ['#b84c2e','#0a6fa8','#4a7c3f','#c9923a','#7c3aed','#0891b2'];
function rebuildFilters() {
  const cats = [...new Set(allEntries.map(e=>e.category||'').filter(Boolean))];
  const el = document.getElementById('filter-chips');
  const sep = document.getElementById('filter-sep-1');
  if(!el) return;
  if(!cats.length) { el.innerHTML=''; if(sep)sep.style.display='none'; return; }
  if(sep)sep.style.display='';
  cats.forEach((cat,i) => { if(!CAT_COLORS[cat]) CAT_COLORS[cat]=palette[i%palette.length]; });
  el.innerHTML = cats.map(cat => `<div class="filter-chip ${activeCategories.has(cat)?'active':''}" onclick="toggleCat('${cat.replace(/'/g,"\\'")}')"><span class="chip-dot" style="background:${CAT_COLORS[cat]||'#b84c2e'}"></span>${cat}</div>`).join('');
}
function toggleCat(cat) {
  if(activeCategories.has(cat)) activeCategories.delete(cat); else activeCategories.add(cat);
  rebuildFilters(); renderTimeline();
}
function setImpFilter(level) {
  minImp = level==='all' ? 1 : parseInt(level);
  document.querySelectorAll('.filter-imp-btn').forEach(b=>b.classList.toggle('active',b.dataset.imp===String(level)));
  renderTimeline();
}

// ── LIGHTBOX ──
let lbEntries = {};
function openLightbox(entryId, startIdx) {
  const e = allEntries.find(x=>x.id===entryId); if(!e) return;
  lbImages = e.images&&e.images.length ? e.images : [];
  if(!lbImages.length) return;
  lbIdx = startIdx||0; lbTitle = e.title; lbRender();
  document.getElementById('lightbox').classList.add('visible');
}
function lbRender() {
  document.getElementById('lightbox-img').src = lbImages[lbIdx];
  document.getElementById('lightbox-caption').textContent = lbTitle;
  document.getElementById('lightbox-counter').textContent = lbImages.length>1 ? `${lbIdx+1} / ${lbImages.length}` : '';
  document.getElementById('lightbox-nav').style.display = lbImages.length>1 ? '' : 'none';
}
function lbNav(d) { lbIdx=(lbIdx+d+lbImages.length)%lbImages.length; lbRender(); }
function closeLightbox() { document.getElementById('lightbox').classList.remove('visible'); }
document.getElementById('lightbox').addEventListener('click',e=>{ if(e.target===document.getElementById('lightbox'))closeLightbox(); });
document.addEventListener('keydown',e=>{ if(!document.getElementById('lightbox').classList.contains('visible'))return; if(e.key==='Escape')closeLightbox(); if(e.key==='ArrowRight')lbNav(1); if(e.key==='ArrowLeft')lbNav(-1); });

// ── MEDIA POPUP ──
function detectMediaType(url) {
  if(!url) return null;
  if(url.includes('youtube.com')||url.includes('youtu.be')) return 'youtube';
  if(url.includes('vimeo.com')) return 'vimeo';
  if(url.match(/\.(jpg|jpeg|png|gif|webp)(\?|$)/i)) return 'image';
  if(url.match(/\.(mp4|webm|mov)(\?|$)/i)) return 'video';
  return 'link';
}
function getYTEmbed(url) {
  const short=url.match(/youtu\.be\/([^?&]+)/),watch=url.match(/[?&]v=([^?&]+)/),emb=url.match(/\/embed\/([^?&]+)/);
  const id=(short&&short[1])||(watch&&watch[1])||(emb&&emb[1]); if(!id)return null;
  return `https://www.youtube.com/embed/${id}?autoplay=1&controls=0&modestbranding=1&rel=0&showinfo=0`;
}
function getVimeoEmbed(url) { const m=url.match(/vimeo\.com\/(\d+)/); return m?`https://player.vimeo.com/video/${m[1]}?autoplay=1&title=0&byline=0`:null; }
function showMediaPopup(event,url,type) {
  clearTimeout(popupHideTimer);
  const popup=document.getElementById('media-popup'), content=document.getElementById('media-popup-content'), label=document.getElementById('media-popup-label-text');
  popup.classList.remove('visible');
  let html='';
  if(type==='youtube'){const eu=getYTEmbed(url);label.textContent='▶ YouTube';html=eu?`<iframe src="${eu}" allow="autoplay;encrypted-media" allowfullscreen></iframe>`:'<p style="color:white;padding:20px">Could not parse URL</p>';}
  else if(type==='vimeo'){const eu=getVimeoEmbed(url);label.textContent='▶ Vimeo';html=eu?`<iframe src="${eu}" allow="autoplay" allowfullscreen></iframe>`:'<p style="color:white;padding:20px">Could not parse URL</p>';}
  else if(type==='image'){label.textContent='⊞ Image';html=`<img src="${url}" alt="Media" />`;}
  else if(type==='video'){label.textContent='▶ Video';html=`<video src="${url}" controls autoplay style="width:100%;max-height:200px;background:#000"></video>`;}
  else{label.textContent='🔗 Link';html=`<div style="padding:16px;color:rgba(245,240,232,0.7);font-family:monospace;font-size:10px;word-break:break-all">${url}<br><br><a href="${url}" target="_blank" style="color:#c9923a">Open ↗</a></div>`;}
  content.innerHTML=html;
  const rect=event.currentTarget.getBoundingClientRect();
  let left=rect.right+10, top=rect.top-40;
  if(left+320>window.innerWidth-20)left=rect.left-330;
  if(top+220>window.innerHeight-20)top=window.innerHeight-230;
  if(top<10)top=10;
  popup.style.left=left+'px'; popup.style.top=top+'px';
  popup.classList.add('visible');
  popup.onmouseenter=()=>clearTimeout(popupHideTimer);
  popup.onmouseleave=()=>scheduleHidePopup();
}
function scheduleHidePopup(){popupHideTimer=setTimeout(hideMediaPopup,300);}
function hideMediaPopup(){const p=document.getElementById('media-popup');p.classList.remove('visible');setTimeout(()=>{document.getElementById('media-popup-content').innerHTML='';},200);}
document.addEventListener('scroll',hideMediaPopup,true);
document.addEventListener('click',e=>{if(!e.target.closest('#media-popup')&&!e.target.closest('.media-badge'))hideMediaPopup();});

// ── INIT & AUTO-REFRESH ──
loadData();
if(REFRESH_MS > 0) setInterval(loadData, REFRESH_MS);
</script>
</body>
