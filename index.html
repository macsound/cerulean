<style>
.sc-header{position:sticky;top:0;z-index:100;background:#ffffff;border-bottom:1px solid #e8e8e8}

.sc-nav a{font-size:13px;font-weight:500;color:#111111;text-decoration:none;padding:4px 0;border-bottom:2px solid transparent;transition:all .15s}
.sc-nav a:hover{color:#307FE2;border-bottom-color:#307FE2}
.sc-page{position:relative;min-height:860px;max-width:960px;margin:0 auto;overflow:hidden}

  .sc-header-inner{padding:0 16px}
  .sc-nav{gap:14px}
  .sc-nav a{font-size:12px}
  .sc-page{overflow-x:hidden;min-height:auto}
  .sc-page>[style*="position:absolute"]{position:relative!important;left:auto!important;top:auto!important;width:100%!important;height:auto!important;margin-bottom:16px}
}
</style>
</head>
